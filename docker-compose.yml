# Aplikasi SKPI off-chain: frontend (nginx) + backend + PostgreSQL. Nilai lingkungan dari .env (salin .env.example).
# Jaringan Fabric berada di luar compose ini (VM unila-chain); nama peer dipetakan lewat extra_hosts karena
# kontainer tidak membaca file hosts milik host.
name: skpi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - skpi-pg:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Sandi dikirim terpisah (bukan di URL) sehingga simbol seperti / @ : # aman.
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-skpi-channel}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-skpi}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-UnilaMSP}
      FABRIC_PEER_ENDPOINT: peer1.${FABRIC_DOMAIN}:7051
      FABRIC_PEER_HOST_ALIAS: peer1.${FABRIC_DOMAIN}
      FABRIC_TLS_CA_PATH: /wallet/tls-ca.pem
      FABRIC_WALLET_DIR: /wallet
      FABRIC_READER_IDENTITY: ${FABRIC_READER_IDENTITY:-app-reader}
      FABRIC_EVALUATE_TIMEOUT_MS: ${FABRIC_EVALUATE_TIMEOUT_MS:-5000}
      FABRIC_ENDORSE_TIMEOUT_MS: ${FABRIC_ENDORSE_TIMEOUT_MS:-15000}
      FABRIC_SUBMIT_TIMEOUT_MS: ${FABRIC_SUBMIT_TIMEOUT_MS:-20000}
      FABRIC_CONFIRM_WAIT_MS: ${FABRIC_CONFIRM_WAIT_MS:-45000}
      FABRIC_COMMIT_TIMEOUT_MS: ${FABRIC_COMMIT_TIMEOUT_MS:-60000}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-15000}
      RECONCILE_GIVE_UP_MS: ${RECONCILE_GIVE_UP_MS:-600000}
      VERIFY_RATE_LIMIT_PER_MIN: ${VERIFY_RATE_LIMIT_PER_MIN:-30}
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "peer1.${FABRIC_DOMAIN}:${PEER1_IP}"
      - "peer2.${FABRIC_DOMAIN}:${PEER2_IP}"
    volumes:
      - ./wallet:/wallet:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"

volumes:
  skpi-pg:
